[package]
name = "thai-font-kit-core"
version = "0.2.1"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
directories = "6"
fs2 = "0.4"
ttf-parser = "0.25"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

